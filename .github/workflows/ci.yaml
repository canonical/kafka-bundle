name: Tests

on:
  workflow_dispatch:
    inputs:
      kafka-channel:
        description: "Channel to use for the Kafka charm (broker and controller)"
        default: "4/edge"
        required: false
        type: choice
        options:
          - "4/edge"
          - "4/beta"
          - "4/candidate"
          - "4/stable"
  pull_request:
  workflow_call:
    inputs:
      kafka-channel:
        description: "Channel to use for the Kafka charm (broker and controller)"
        default: "4/edge"
        required: false
        type: string
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  lint-terraform:
    name: Lint Terraform
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Terraform
        run: sudo snap install terraform --channel=latest/stable --classic
      - name: Check formatting (terraform/ and terraform/examples)
        run: terraform fmt -check -recursive -diff
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: Init TFLint
        run: tflint --init
      - name: Run TFLint
        run: tflint --recursive
      - name: Check README.md is up to date
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: terraform
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  integration-test-terraform:
    strategy:
      fail-fast: false
      matrix:
        tox-environment:
          - integration-terraform
          - integration-terraform-cos
        kraft-mode:
          - single
          - multi
        juju:
          - snap_channel: "3.6/stable"
    runs-on: [self-hosted, linux, AMD64, X64, xlarge, noble]
    name: ${{ matrix.tox-environment }}_${{ matrix.kraft-mode }}_${{ matrix.juju.snap_channel }}
    needs:
      - lint
      - lint-terraform
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          # dev preset bootstraps a Canonical K8s & LXD controller & jq
          # https://canonical.com/juju/docs/concierge/reference/presets/
          sudo concierge prepare -p dev --extra-debs pipx
          # Install TOX
          pipx ensurepath
          pipx install tox
          # Install Terraform
          sudo snap install terraform --channel=latest/stable --classic
          # Switch to the LXD controller
          juju switch concierge-lxd
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        run: |
          tox run -e ${{ matrix.tox-environment }} -- -m '${{ steps.select-tests.outputs.mark_expression }}' --keep-models --kraft-mode=${{ matrix.kraft-mode }} --kafka-channel=${{ inputs.kafka-channel || '4/edge' }}
